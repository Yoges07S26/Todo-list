
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #e3f2fd;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #1565c0;
        }

        input[type="text"] {
            padding: 10px;
            width: 190px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 9px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.7;
        }

        .add {
            background: #2196f3;
            color: white;
        }

        .delete {
            background: #f44336;
            color: white;
            margin-left: 8px;
        }

        ul {
            padding-left: 0;
        }

        li {
            list-style: none;
            background: #f5f5f5;
            margin: 10px 0;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 5px;
        }

        li span {
            flex: 1;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        #message {
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>My To-Do List</h2>

    <input type="text" id="task" placeholder="Enter your task">
    <button class="add" onclick="addTask()">Add</button>

    <p id="message">No tasks added yet.</p>
    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        let input = document.getElementById("task");
        let taskName = input.value.trim();

        if (taskName === "") {
            alert("Please enter a task!");
            return;
        }

        let li = document.createElement("li");

        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";

        let span = document.createElement("span");
        span.textContent = taskName;

        checkbox.onchange = function() {
            span.classList.toggle("completed", checkbox.checked);
        };

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.onclick = function() {
            li.remove();
            updateMessage();
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);

        document.getElementById("taskList").appendChild(li);

        input.value = "";
        input.focus();

        updateMessage();
    }

    function updateMessage() {
        let list = document.getElementById("taskList");
        let message = document.getElementById("message");

        if (list.children.length === 0) {
            message.textContent = "No tasks added yet.";
        } else {
            let completed = list.querySelectorAll(
                "input[type='checkbox']:checked"
            ).length;

            message.textContent =
                list.children.length + " tasks | " +
                completed + " completed";
        }
    }

    document.getElementById("task").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });

    document.getElementById("taskList").addEventListener("change", updateMessage);
</script>

</body>
</html>
